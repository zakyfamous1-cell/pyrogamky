name: Unzip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip
        run: |
          mkdir tmp_extract
          unzip -o ./*.zip -d tmp_extract
          rm -f ./*.zip
          rm -rf tmp_extract/*/.github
          cp -a tmp_extract/*/. .
          rm -rf tmp_extract

      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Unzip pyrogram [skip ci]" || echo "nothing to commit"
          git push
