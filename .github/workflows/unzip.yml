name: Unzip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          unzip -o pyrogram--main.zip
          mv pyrogram--main/* . || true
          rm -rf pyrogram--main pyrogram--main.zip

      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Unzip pyrogram [skip ci]" || echo "nothing to commit"
          git push
